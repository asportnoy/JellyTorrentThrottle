name: Build and Push Docker Image

on:
  push:
    branches: [ main, copilot/tweak-gh-workflow-publish-gh-packages ]
    paths:
      - 'JellyTorrentThrottle.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'JellyTorrentThrottle.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/docker-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest Git tag
        id: git_tag
        run: |
          git fetch --tags
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
          echo "LATEST_TAG=$latest_tag" >> $GITHUB_OUTPUT

      - name: Get lowercase image name
        id: image_name
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$repository" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image (multi-platform)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image_name.outputs.IMAGE }}:${{ steps.git_tag.outputs.LATEST_TAG }}
            ${{ steps.image_name.outputs.IMAGE }}:latest
          platforms: linux/amd64,linux/arm64